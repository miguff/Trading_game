[project]
name = "energy-trading-mvp"
version = "0.1.0"
description = "Energy Trading MVP - AI Hackathon Group 3"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.0",
    "uvicorn[standard]>=0.49.0",
    "jinja2>=3.1.6",
    "httpx>=0.28.0",
    "anyio>=4.13.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=0.23.0",
]


[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
